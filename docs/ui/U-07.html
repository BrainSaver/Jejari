<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 결과</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d1f24;--mut:#6b7079;--line:#e4e5e8;--pri:#2f5bd3;--pri2:#e8eefc;--ok:#1d6b33;--okb:#e3f4e6;--bad:#a12c2c;--badb:#fbe9e9;--warn:#7a5600;--warnb:#fff5db}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.app{max-width:420px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.bar{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.bar h1{font-size:17px;margin:0;flex:1}.bar a{color:var(--fg);text-decoration:none;font-size:20px}
.body{padding:16px;flex:1;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:700;background:var(--pri);color:#fff;text-decoration:none;cursor:pointer}
.btn.sub{background:var(--pri2);color:var(--pri)}.btn.line{background:none;border:1px solid var(--line);color:var(--fg)}.btn.off{background:#c9ccd3;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.field label{font-size:13px;color:var(--mut);font-weight:600}
input,select{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.mut{color:var(--mut);font-size:13px}.big{font-size:28px;font-weight:800}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--pri2);color:var(--pri)}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.bad{background:var(--badb);color:var(--bad)}.tag.warn{background:var(--warnb);color:var(--warn)}
.err{background:var(--badb);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px}
.note{background:var(--warnb);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px}
.tabbar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex}
.tabbar a{flex:1;text-align:center;padding:10px 0;font-size:12px;color:var(--mut);text-decoration:none}.tabbar a.on{color:var(--pri);font-weight:700}
.list a.item{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.seats{display:grid;grid-template-columns:repeat(2,1fr) 18px repeat(2,1fr);gap:6px}
.seat{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.seat.taken{background:#d9dce2;color:#999}.seat.hold{background:var(--warnb);color:var(--warn)}.seat.mine{background:var(--pri);color:#fff;border-color:var(--pri)}
.aisle{}
</style>
</head>
<body>
<div class="app">
<header class="bar"><h1>결제 결과</h1></header>
<main class="body">
<div class="card" style="text-align:center;padding:24px">
  <div style="font-size:42px">✓</div><div class="big" style="font-size:22px">예매가 확정됐어요</div>
  <div class="mut">승차권 번호 T-20270206-000123</div>
</div>
<div class="card"><b>101 · 서울 06:00 → 부산 08:40</b><div class="mut">2호차 2A, 2B · 119,600원</div></div>
<div class="card" style="text-align:center"><span class="tag warn">확인 중 화면</span><p class="mut">결제 결과를 확인하고 있어요. 이 화면을 닫아도 확정되면 알림으로 알려드려요.</p></div>
<div class="card" style="text-align:center"><span class="tag bad">실패 화면</span><p class="mut">결제가 승인되지 않았어요. 좌석은 다른 분께 돌아갔어요.</p></div>
<a class="btn" href="U-08.html">예매 내역 보기</a>
<a class="btn line" href="U-03.html">처음으로</a>
</main>

</div>
</body>
</html>
