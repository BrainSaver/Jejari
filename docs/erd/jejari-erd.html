<meta charset="utf-8">
<title>제자리 ERD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 제도판 캔버스(점 격자) 위에 테이블 노드, 오른쪽에 속성 패널. 좁은 화면에선 패널이 하단 시트로. */
:root{
  --bg:#e9ecea; --canvas:#f4f6f4; --surface:#ffffff; --surface2:#f2f4f2;
  --fg:#18211d; --muted:#5a6661; --line:#d3d9d5; --grid:#c4ccc7;
  --accent:#1d6b58; --accent-fg:#ffffff; --link:#7b8a83; --danger:#b3392f;
  --shadow:0 1px 2px rgba(20,30,25,.08),0 4px 14px rgba(20,30,25,.06);
  --g-ref:#2a7f7b; --g-member:#7f52a3; --g-resv:#c4661a; --g-event:#3567b4;
  --g-wait:#a07a0e; --g-risk:#a8386f; --g-mongo:#3f8a45; --g-redis:#c8403a; --g-synth:#6b7a20; --g-auth:#8a6233; --g-replay:#0e86a8; --g-ext:#5d6a73;
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1312; --canvas:#141917; --surface:#1b211f; --surface2:#222a27;
  --fg:#e4eae7; --muted:#97a49e; --line:#2e3733; --grid:#2a332f;
  --accent:#52c09f; --accent-fg:#0d1a15; --link:#6e7d76; --danger:#e2675c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  --g-ref:#4fb0aa; --g-member:#ab84cc; --g-resv:#e08a45; --g-event:#6d98dc;
  --g-wait:#cfa43a; --g-risk:#d46a9e; --g-mongo:#6fb873; --g-redis:#e8716a; --g-synth:#a2b24c; --g-auth:#c99c64; --g-replay:#4cbcdc; --g-ext:#97a5ae;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1312; --canvas:#141917; --surface:#1b211f; --surface2:#222a27;
  --fg:#e4eae7; --muted:#97a49e; --line:#2e3733; --grid:#2a332f;
  --accent:#52c09f; --accent-fg:#0d1a15; --link:#6e7d76; --danger:#e2675c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  --g-ref:#4fb0aa; --g-member:#ab84cc; --g-resv:#e08a45; --g-event:#6d98dc;
  --g-wait:#cfa43a; --g-risk:#d46a9e; --g-mongo:#6fb873; --g-redis:#e8716a; --g-synth:#a2b24c; --g-auth:#c99c64; --g-replay:#4cbcdc; --g-ext:#97a5ae;
  color-scheme:dark}

[hidden]{display:none!important} /* 파일로 직접 열 때도 모달이 숨겨지도록 */
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

/* 상단 바 */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.search{position:relative}
.search input{width:220px;max-width:46vw;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px 0 30px}
.search svg{position:absolute;left:9px;top:9px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.btn{height:34px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}

/* 그룹 필터 */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;cursor:grab;-webkit-user-select:none;user-select:none;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chips.grabbing,.chips.grabbing .chip{cursor:grabbing}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px}
.chip i{width:9px;height:9px;border-radius:3px;background:var(--gc)}
.chip b{font-weight:500;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.chip.off{opacity:.45}
.chip.off i{background:transparent;border:1.5px solid var(--gc)}

/* 본문 */
.main{flex:1;min-height:0;display:flex;gap:10px}
.stage{position:relative;flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--canvas);background-image:radial-gradient(var(--grid) 1px,transparent 1.2px)}
.stage.panning{cursor:grabbing}
.stage,.stage *{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
body.dragging,body.dragging *{-webkit-user-select:none!important;user-select:none!important}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.lk{fill:none;stroke:var(--link);stroke-width:1.4}
.lk.logical{stroke-dasharray:5 4}
.lk.on{stroke:var(--accent);stroke-width:2.2}
.lk.dim{opacity:.18}
.mk{fill:none;stroke:context-stroke;stroke-width:1.4}

/* 노드 */
.node{position:absolute;width:272px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);cursor:pointer;user-select:none;transition:opacity .15s}
.node .nh{height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;
  background:color-mix(in oklab,var(--gc) 16%,var(--surface));border-top:3px solid var(--gc)}
.node .nn{font-family:var(--f-mono);font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .nk{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto}
.node .rows{padding:3px 0}
.row{height:22px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px}
.row:hover{background:var(--surface2)}
.row .key{width:34px;flex:none;font-family:var(--f-mono);font-size:9px;font-weight:500;letter-spacing:.02em;color:var(--muted);white-space:nowrap;overflow:hidden}
.row .key.pk{color:var(--g-wait)}
.row .key.fk{color:var(--g-event)}
.row .cn{font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .ct{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap;padding-left:6px}
.row.hit{background:color-mix(in oklab,var(--accent) 18%,transparent)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in oklab,var(--accent) 45%,transparent),var(--shadow)}
.node.rel{border-color:color-mix(in oklab,var(--accent) 50%,var(--line))}
.node.dim{opacity:.32}
.node.faded{opacity:.09;pointer-events:none;filter:grayscale(1)}
.lk.faded{opacity:.05}
.lk.planned{stroke-dasharray:2 4}
.node.planned{border-style:dashed;background:color-mix(in oklab,var(--surface) 72%,var(--canvas))}
.node.planned .nh{border-top-style:dashed;background:color-mix(in oklab,var(--gc) 8%,var(--surface))}
.node .tag.plan{border-style:dashed}
.samples{overflow-x:auto;border:1px solid var(--line);border-radius:7px}
table.dt{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
table.dt th,table.dt td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;line-height:1.5}
table.dt th{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface2);white-space:nowrap;position:sticky;top:0}
table.dt td.mono{font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
table.dt input{width:100%;min-width:90px;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:5px 7px}
.tref{font:inherit;font-family:var(--f-mono);font-size:11.5px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in oklab,var(--accent) 40%,transparent);text-underline-offset:2px}
.dbody{overflow:auto;padding:12px;flex:1;min-height:0}
.dbody .p{margin:0 0 10px}
.stat{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:color-mix(in oklab,var(--g-wait) 18%,var(--surface));color:color-mix(in oklab,var(--g-wait) 70%,var(--fg));white-space:nowrap}
.dec-list{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.dec-list div{display:flex;gap:8px;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:4px}
.dec-list span:last-child{color:var(--muted);text-align:right}
.node .tag{flex:none;font-family:var(--f-mono);font-size:9px;font-weight:500;letter-spacing:.05em;padding:1px 4px;border-radius:4px;border:1px solid color-mix(in oklab,var(--muted) 55%,transparent);color:var(--muted)}
.node .tag.big{border-color:color-mix(in oklab,var(--gc) 60%,transparent);color:color-mix(in oklab,var(--gc) 75%,var(--fg))}
.btn[aria-pressed="true"]{background:color-mix(in oklab,var(--accent) 16%,var(--surface));border-color:var(--accent)}

.zoombox{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
.zoombox button{width:32px;height:30px;border:0;background:transparent;border-radius:7px;cursor:pointer;font-size:16px}
.zoombox button:hover{background:var(--surface2)}
.zoombox .pct{min-width:52px;text-align:center;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;cursor:pointer;border:0;background:transparent}
.zoombox .fit{font-size:12px;width:auto;padding:0 10px}
.hint{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--muted);background:color-mix(in oklab,var(--surface) 85%,transparent);padding:5px 9px;border-radius:7px;border:1px solid var(--line)}

/* 패널 */
.panel{width:380px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .x{margin-left:auto;width:30px;height:30px;border:0;background:transparent;border-radius:7px;cursor:pointer;font-size:18px;color:var(--muted)}
.ph .x:hover{background:var(--surface2)}
.pb{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
.gtag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 8px;border-radius:6px;background:color-mix(in oklab,var(--gc) 16%,var(--surface));color:color-mix(in oklab,var(--gc) 70%,var(--fg));white-space:nowrap}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h3{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec>h3 .btn{margin-left:auto}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:7px;padding:7px 9px;min-width:0}
.fld textarea{resize:vertical;min-height:58px;line-height:1.5}
.fld input.mono{font-family:var(--f-mono);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.p{margin:0;line-height:1.6;color:var(--fg)}
.p.muted{color:var(--muted);font-size:13px}

.rel-list{display:flex;flex-direction:column;gap:4px}
.rel-item{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;padding:6px 8px;border-radius:6px;background:var(--surface2);cursor:pointer;border:1px solid transparent;text-align:left}
.rel-item:hover{border-color:var(--line)}
.rel-item .dir{font-family:var(--f-ui);font-size:11px;color:var(--muted);width:30px;flex:none}

details.col{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.col[open]{background:var(--surface2)}
details.col>summary{list-style:none;display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:pointer;font-size:12.5px}
details.col>summary::-webkit-details-marker{display:none}
details.col>summary .cn{font-family:var(--f-mono);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.col>summary .ct{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
details.col>summary .key{font-family:var(--f-mono);font-size:10px;width:34px;flex:none;color:var(--muted)}
details.col .cbody{padding:4px 9px 10px;display:flex;flex-direction:column;gap:8px}
.keys{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px}
.keys label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.colacts{display:flex;gap:6px}
.colacts .btn.danger{margin-left:auto}
.desc-view{font-size:12.5px;line-height:1.55;color:var(--muted);margin:0}
.desc-view b{color:var(--fg);font-weight:500}

.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12.5px;align-items:center}
.legend svg{width:46px;height:12px;overflow:visible}
.ov-groups{display:flex;flex-direction:column;gap:4px}
.ov-g{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.ov-g:hover{background:var(--surface2)}
.ov-g i{width:10px;height:10px;border-radius:3px;background:var(--gc);flex:none}
.ov-g b{margin-left:auto;font-weight:400;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.5;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface2);color:var(--fg)}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(10,16,13,.45);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{width:min(760px,100%);max-height:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.mtabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.mtab{height:30px;padding:0 12px;border-radius:7px;border:1px solid transparent;background:transparent;cursor:pointer;font-size:13px}
.mtab.on{background:var(--surface2);border-color:var(--line);font-weight:600}
.mtabs .x{margin-left:auto}
.mbody{padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.mbody textarea{flex:1;min-height:320px;width:100%;font-family:var(--f-mono);font-size:12px;line-height:1.5;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px;resize:vertical;white-space:pre;overflow:auto}
.mfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mfoot .p{margin-right:auto}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  .panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:62%;border-radius:14px 14px 0 0;z-index:40;box-shadow:0 -8px 30px rgba(0,0,0,.2);
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel.closed{display:none}
  .hint{display:none}
  .brand .meta{display:none}
  .search input{width:150px}
  .btn .lbl{display:none}
}
@media (min-width:821px){.panel.closed .x{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><h1>제자리 ERD</h1><span class="meta" id="meta"></span></div>
    <label class="search" for="q"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="테이블·컬럼 검색" autocomplete="off"></label>
    <button class="btn" id="bUndo" title="실행 취소 (Ctrl+Z)">↶<span class="lbl"> 되돌리기</span></button>
    <button class="btn" id="bLayout" title="기본 배치로 정렬">⊞<span class="lbl"> 자동 정렬</span></button>
    <button class="btn" id="bBig" aria-pressed="false" title="빅데이터 테이블을 흐리게 해서 나머지 구조만 보기">◐<span class="lbl"> 빅데이터</span></button>
    <button class="btn" id="bPlan" aria-pressed="true" title="확장 예정 테이블 표시">┄<span class="lbl"> 확장 예정</span></button>
    <button class="btn" id="bDocs" title="결정 사항·추적표·시나리오 등 설계 문서">▤<span class="lbl"> 문서</span></button>
    <button class="btn" id="bIO">⇅<span class="lbl"> 내보내기</span></button>
    <button class="btn primary" id="bAdd">＋ 테이블</button>
  </header>
  <nav class="chips" id="chips" aria-label="그룹 필터"></nav>
  <div class="main">
    <main class="stage" id="stage">
      <div class="world" id="world">
        <svg id="links" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="mMany" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
              <path class="mk" d="M11 6 L1 1 M11 6 L1 6 M11 6 L1 11"/></marker>
            <marker id="mOne" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
              <path class="mk" d="M7 1 L7 11 M10 1 L10 11"/></marker>
          </defs>
          <g id="lg"></g>
        </svg>
        <div id="nodes"></div>
      </div>
      <div class="hint">배경 드래그 이동 · 휠/핀치 확대 · 테이블 드래그 배치 · 클릭하면 설명</div>
      <div class="zoombox">
        <button id="zOut" aria-label="축소">−</button>
        <button class="pct" id="zPct" title="100%로">100%</button>
        <button id="zIn" aria-label="확대">＋</button>
        <button class="fit" id="zFit">화면 맞춤</button>
      </div>
    </main>
    <aside class="panel" id="panel">
      <div class="ph" id="ph"></div>
      <div class="pb" id="pb"></div>
    </aside>
  </div>

  ['동시성 절차','트랜잭션 경계·실행 순서·SQL·Redis 명령은 docs/concurrency.md가 원천. 테이블 비고에는 제약·인덱스와 절 번호만','같은 규칙이 여러 곳에 흩어지면 어긋남'],
  ['네이티브 UPDATE','updated_at = SYSTIMESTAMP, version 컬럼이 있으면 version = version + 1, 현재 상태를 WHERE에 넣고 영향 행 수 확인 (concurrency.md §0.3)','값이 거짓이 되거나 JPA 낙관적 락이 충돌을 놓침'],
  ['락 순서','예약에 딸린 행은 그 reservation 행을 먼저 잠근 뒤 변경, 여러 예약은 reservation_id 오름차순으로 한 건씩, 새 seat_inventory·purchase_counter는 정렬 순서, waitlist는 SKIP LOCKED (concurrency.md §0.4)','데드락 방지. IN + ORDER BY FOR UPDATE는 잠금 순서를 보장하지 않음'],
  ['참조 전용 테이블','station·route·car_type은 행 삭제 금지. 이 테이블을 가리키는 FK에는 인덱스를 만들지 않음 (refOnly)','쓰기 폭주 테이블의 불필요한 인덱스 제거'],
  ['outbox 샤드','outbox_event.shard_no는 INSERT 문에서 ORA_HASH(TO_CHAR(:partition_key), 15)로 계산. partition_key는 항상 문자열로 바인딩','숫자·문자열 해시가 달라 같은 예약 이벤트가 다른 샤드로 가면 순서가 깨짐'],
  ['Redis 보상','DB 롤백이면 그 자리에서 되돌림. 커밋 뒤 정리는 앱이 바로 한 번 + outbox 이벤트 소비자(seat-release)가 한 번 더. 스크립트는 두 번 실행해도 결과가 같음 (concurrency.md §14.3)','앱이 커밋 직후 죽어도 SOLD 키·한도가 출발까지 남지 않음']]},
 flows:{title:'흐름',head:['흐름','단계 (자세한 절차: docs/concurrency.md)'],rows:[
  ['예매','로그인 → 대기열(위험 점수만큼 뒤로) → 입장 토큰(queue:pass) → 멱등 키로 reservation_id 확보 (§1) → limit:* 1차 → seat:hold 전 구간 SET NX, 패배자는 DB 쓰기 0건 → 승자만 한 트랜잭션: reservation → seat_inventory → reservation_seat → purchase_counter → reservation_history → saga_instance → outbox SEAT_HELD (§2) → 롤백되면 Redis 보상 (§2.3)'],
  ['재선점','만료된 HOLD가 있으면 같은 트랜잭션에서 이전 예약을 잠그고 HOLD일 때만 EXPIRED, 이전 예약의 HOLD 행 전부 삭제, 카운터 전체 감소. 결제 중·확정 예약은 재선점 불가 (§3)'],
  ['결제 시작','HOLD → PAYMENT_PENDING 조건부 UPDATE로 마감을 GREATEST로 한 번 연장 → seat_inventory·saga 복사, 좌석 수만큼 갱신돼야 진행 → payment REQUESTED → 커밋 후 seat:hold 연장 → PG 호출 (§4)'],
  ['결제 결과','reservation 행을 먼저 잠그고 payment 상태로 갈래: REQUESTED면 seat_inventory K행 SOLD → payment APPROVED → reservation CONFIRMED → saga CONFIRMED·DONE → SOLD:R. FAILED 뒤 승인이면 APPROVED 기록 + 전액 환불. PG 실패면 payment FAILED + 예약 EXPIRED (§5)'],
  ['만료 스캐너','HOLD 만료(ix_resv_hold_due)와 결제 결과 확인(payment.next_check_at)을 따로 조회. PG 없음이면 주문 취소 후 실패 처리, 모름이면 next_check_at을 미루고 seat:hold 다시 걸기, 자동 만료 없음 (§6)'],
  ['해제','예약 상태 조건부 UPDATE 1행 → HOLD 행 삭제 → 카운터 감소 → saga COMPENSATED → outbox RESERVATION_EXPIRED·CANCELED → 커밋 후 좌석 키 REOFFER·한도 감소 (§7, §14.3)'],
  ['취소','CONFIRMED → CANCELED 1행 → SOLD 행 삭제 → 카운터 감소 → cancellation(USER 수수료 / ADMIN 0) → 커밋 후 좌석 키 REOFFER·한도 감소·환불 요청 → 출발 후 resold_yn 배치 (§8)'],
  ['취소표','빈 좌석 이벤트(seat-release) → Redis 보상 → processed_event → 대기자 FOR UPDATE SKIP LOCKED → 맞는 대기자 명의로 선점(입장 토큰 생략, 키 wl:waitlist_id, REOFFER 키 인계) + OFFERED, 한도 초과면 SKIPPED → 대기자가 없으면 REOFFER 해제 (§9)'],
  ['매수 제한','limit:* Lua 1차 → purchase_counter 조건부 UPDATE 최종, 행 없으면 INSERT(ORA-00001 재시도) → 감소는 상태 UPDATE 1행일 때만 → 한 트랜잭션의 카운터는 정렬 순서로 → Redis 복원은 SET NX 후 INCRBY (§10)'],
  ['outbox 릴레이','reservation 행 갱신 뒤 outbox INSERT(seq) → 샤드마다 Redis 리스 → 맨 앞 N개 rowid만 FOR UPDATE WAIT → seq 순 하나씩 발행 → 실패하면 그 회차 즉시 중단, 재시도 소진 시 FAILED·샤드 정지 (§11)'],
  ['Kafka 소비','processed_event INSERT(중복이면 skip) → 업무 처리 → 커밋 → 오프셋 커밋 (§12)'],
  ['로그 적재·보관','behavior_log·replay_event는 Kafka → insertMany. expire_at TTL, legal_hold 세션은 컨슈머가 expire_at 없이 저장 (§13)'],
  ['운영 설정 변경','app_policy 값 변경 → version + 1 → app_policy_history 한 행 → policy:cache 갱신 → 각 서버가 version 비교 후 다시 로딩'],
  ['위험 점수','behavior_log·replay_event·cancellation → risk_feature → model_run(활성 모델) → risk_score → risk:* 캐시 → 대기열 score 반영'],
  ['CCTV','임계 초과·규칙 적중 → suspicious_case → 같은 CI·기기·결제수단 세션 case_session → 자동 case_marker → evidence_snapshot 동결(조각+해시) → 관리자 재생·판정 → admin_action → replay_access_log에 열람 기록'],
  ['Argon2 로그인','rate:login 확인 → 세마포어 획득(auth.max_concurrent_hash) → Argon2id 검증(없는 계정도 더미 해시) → verify_ms 기록 → needs_rehash면 재해싱 → auth_session 발급']]},

const NW=272, HEAD=39, ROW=22, PADB=6, GAPX=88, GAPY=36;

const convTable=t=>({id:t.id,ko:t.ko,g:t.g,db:t.db||'',big:!!t.big,planned:!!t.planned,noUpdatedAt:!!t.noUpdatedAt,refOnly:!!t.refOnly,desc:t.desc,notes:t.notes,samples:t.samples?JSON.parse(JSON.stringify(t.samples)):[],x:0,y:0,cols:t.cols.map(convCol)});
function fromSeedBase(){ return SEED.map(convTable); }
/* 패치 적용: 새 테이블 추가 → ops 순서대로. 모두 멱등 (두 번 적용해도 결과 같음)
   ops: ['add',표,뒤에올컬럼|null,[컬럼튜플…]] ['set',표,컬럼,{필드}] ['del',표,컬럼] ['prop',표,{테이블필드}] ['samples+',표,[행…]](PK가 없는 행만 추가) ['samples=',표,[행…]](PK로 찾아 필드 덮어쓰기, 없으면 추가)
        ['notes',표,문자열] ['notes+',표,문자열] ['desc',표,문자열] ['droptable',표] */
function applyPatch(list,p){
  const get=id=>list.find(t=>t.id===id);
  (p.tables||[]).forEach(sd=>{ if(!get(sd.id)) list.push(convTable(sd)); });
  (p.ops||[]).forEach(([k,tid,a,b])=>{
    if(k==='droptable'){ const i=list.findIndex(t=>t.id===tid); if(i>=0){ list.splice(i,1); list.forEach(x=>x.cols.forEach(c=>{if(c.fk===tid)c.fk='';})); } return; }
    if(k==='nn-auto')return;
    const t=get(tid); if(!t)return;
    if(k==='add'){ const cols=b.map(convCol).filter(c=>!t.cols.some(x=>x.name===c.name)); if(!cols.length)return;
      let i=a==null?0:t.cols.findIndex(c=>c.name===a)+1; if(a!=null&&i===0)i=t.cols.length; t.cols.splice(i,0,...cols); }
    else if(k==='set'){ const c=t.cols.find(c=>c.name===a); if(c)Object.assign(c,b); }
    else if(k==='del'){ t.cols=t.cols.filter(c=>c.name!==a); }
    else if(k==='prop'){ Object.assign(t,JSON.parse(JSON.stringify(a))); }
    else if(k==='samples='){ const pk=t.cols.filter(c=>hasK(c,'PK')).map(c=>c.name); t.samples=t.samples||[];
      a.forEach(r=>{ const x=t.samples.find(x=>pk.every(n=>x[n]===r[n])); if(x)Object.assign(x,JSON.parse(JSON.stringify(r))); else t.samples.push(JSON.parse(JSON.stringify(r))); }); }
    else if(k==='samples+'){ const pk=t.cols.filter(c=>hasK(c,'PK')).map(c=>c.name); t.samples=t.samples||[];
      a.forEach(r=>{ if(!t.samples.some(x=>pk.every(n=>x[n]===r[n]))) t.samples.push(JSON.parse(JSON.stringify(r))); }); }
    else if(k==='notes') t.notes=a;
    else if(k==='notes+'){ if(!(t.notes||'').includes(a)) t.notes=(t.notes?t.notes+' · ':'')+a; }
    else if(k==='desc') t.desc=a;
    else if(k==='nn'){ a.forEach(n=>{ const c=t.cols.find(c=>c.name===n); if(c&&!hasK(c,'NN'))c.keys=normKeys(c.keys+',NN'); }); }
  });
  // nn-auto는 그 패치 시점까지 정의된 테이블에만 적용 (나중 버전 테이블에 다시 적용되지 않게 → 멱등)
  const known=new Set([...SEED.map(t=>t.id),...PATCHES.filter(x=>x.v<=(p.v||0)).flatMap(x=>(x.tables||[]).map(t=>t.id))]);
  (p.ops||[]).filter(o=>o[0]==='nn-auto').forEach(([,,o])=>{ const ex=new Set(o.except||[]);
    list.filter(t=>known.has(t.id)&&(t.db||GROUPS[t.g]?.db)==='Oracle'&&!t.planned).forEach(t=>t.cols.forEach(c=>{
      if(ex.has(t.id+'.'+c.name)||hasK(c,'PK')||hasK(c,'NN'))return;
      if(c.fk||enumOf(c)) c.keys=normKeys(c.keys+',NN'); })); });
  return list;
}
const KEY_ORDER=['PK','FK','UQ','NN'];
function normKeys(k){ const s=new Set(String(k||'').split(',').filter(Boolean)); return KEY_ORDER.filter(x=>s.has(x)).join(','); }
function applyPatches(list,fromVer){ PATCHES.filter(p=>p.v>fromVer).forEach(p=>applyPatch(list,p)); return list; }
function fromSeed(){ return applyPatches(fromSeedBase(),2); }
function autoLayout(){
  let x=0; const placed=new Set();
  LAYOUT.forEach(colIds=>{let y=0; colIds.forEach(id=>{const t=byId(id); if(!t)return; t.x=x;t.y=y; y+=nodeH(t)+GAPY; placed.add(id);}); x+=NW+GAPX;});
  let y=0; tables.filter(t=>!placed.has(t.id)).forEach(t=>{t.x=x;t.y=y;y+=nodeH(t)+GAPY;});
}
function save(){try{localStorage.setItem(STORE,JSON.stringify({seedVersion:SEED_VERSION,tables,view,hidden:[...hidden],bigFade,showPlanned,decisions}))}catch(e){}}
function load(){
  try{const s=JSON.parse(localStorage.getItem(STORE)||'null');
    if(s&&Array.isArray(s.tables)&&s.tables.length){tables=s.tables;if(s.view)view=s.view;hidden=new Set(s.hidden||[]);bigFade=!!s.bigFade;showPlanned=s.showPlanned!==false;decisions=Array.isArray(s.decisions)?s.decisions:JSON.parse(JSON.stringify(DECISIONS_SEED));return s;}}catch(e){}
  return null;
}
function placeNew(ids){ const set=new Set(ids); if(!set.size)return;
  let x0=Math.max(0,...tables.filter(t=>!set.has(t.id)).map(t=>t.x+NW))+GAPX*2;
  const cols=LAYOUT.map(c=>c.filter(id=>set.has(id))); const rest=ids.filter(id=>!LAYOUT.flat().includes(id)); if(rest.length)cols.push(rest);
  cols.filter(c=>c.length).forEach(c=>{let y=0; c.forEach(id=>{const t=byId(id); t.x=x0; t.y=y; y+=nodeH(t)+GAPY;}); x0+=NW+GAPX;}); }
function migrate(ver){ ver=ver||1; if(ver>=SEED_VERSION)return null;
  const before=new Set(tables.map(t=>t.id));
  if(ver<2){
    fromSeedBase().forEach(sd=>{ const t=byId(sd.id); if(!t){tables.push(sd); return;}
      if(t.big===undefined)t.big=sd.big; if(!t.db&&sd.db)t.db=sd.db;
      sd.cols.forEach(sc=>{ const c=t.cols.find(c=>c.name===sc.name); if(c&&!c.fk&&sc.fk){c.fk=sc.fk; if(!hasK(c,'FK'))c.keys=['PK','FK','UQ'].filter(k=>k==='FK'||hasK(c,k)).join(',');} }); });
    const m=byId('member'); if(m){const i=m.cols.findIndex(c=>c.name==='password_hash'&&c.type==='VARCHAR2(100)'); if(i>=0)m.cols.splice(i,1);}
  }
  applyPatches(tables,Math.max(ver,2));
  DECISIONS_SEED.forEach(d=>{ const x=decisions.find(x=>x.item===d.item); if(!x) decisions.push({...d}); else if(DECISION_REFRESH.concat(DECISION_REFRESH_V8).includes(d.item)&&x.status==='예시') Object.assign(x,d); });
  const added=tables.filter(t=>!before.has(t.id)).map(t=>t.id); placeNew(added);
  return {added:added.length, from:ver};
}

function undo(){ if(!undoStack.length)return; tables=JSON.parse(undoStack.pop()); if(sel&&!byId(sel))sel=null; renderAll(); save(); toast('되돌렸습니다'); $('#bUndo').disabled=!undoStack.length;}

function targetRowIndex(target,col){
  let i=target.cols.findIndex(c=>hasK(c,'PK')&&c.name===col.name);
  if(i<0)i=target.cols.findIndex(c=>hasK(c,'PK'));
  return i<0?0:i;
}
function links(){
  const out=[];
  tables.forEach(t=>t.cols.forEach((c,i)=>{ if(c.fk){const tg=byId(c.fk); if(tg) out.push({from:t,ci:i,to:tg,ti:targetRowIndex(tg,c),col:c});}}));
  return out;
}
const visible=t=>!hidden.has(t.g)&&(showPlanned||!t.planned);

function matchTable(t){ if(!query)return null; const q=query.toLowerCase();
  const tm=t.id.toLowerCase().includes(q)||(t.ko||'').toLowerCase().includes(q);
  const cm=t.cols.map(c=>c.name.toLowerCase().includes(q)||(c.desc||'').toLowerCase().includes(q));
  return {tm, cm, any: tm||cm.some(Boolean)};
}
function related(){ if(!sel)return null; const s=new Set([sel]);
  links().forEach(l=>{ if(l.from.id===sel)s.add(l.to.id); if(l.to.id===sel)s.add(l.from.id);}); return s;}

function renderNodes(){

    if(m&&!m.any)cls+=' dim';
    if(bigFade&&t.big)cls+=' faded';
    if(t.planned)cls+=' planned';
    const rows=t.cols.map((c,i)=>{
      const ks=c.keys.split(',').filter(k=>k&&k!=='NN'); const kc=ks.includes('PK')?'pk':ks.includes('FK')?'fk':'';

    }).join('');

  }).join('');
}
function drawLinks(){
  const rel=sel;
  $('#lg').innerHTML=links().filter(l=>visible(l.from)&&visible(l.to)).map(l=>{
    const a=l.from,b=l.to;
    const ay=a.y+HEAD+l.ci*ROW+ROW/2, by=b.y+HEAD+l.ti*ROW+ROW/2;
    let ax,bx,c1,c2;
    const acx=a.x+NW/2, bcx=b.x+NW/2;
    if(a===b){ax=a.x+NW;bx=a.x+NW;const d=60;return path(`M${ax} ${ay} C${ax+d} ${ay},${bx+d} ${by},${bx} ${by}`,l,rel);}
    if(Math.abs(acx-bcx)<NW*.6){ // 같은 열: 오른쪽으로 우회
      ax=a.x+NW;bx=b.x+NW;const d=46+Math.abs(ay-by)*.08; return path(`M${ax} ${ay} C${ax+d} ${ay},${bx+d} ${by},${bx} ${by}`,l,rel);}
    if(acx<bcx){ax=a.x+NW;bx=b.x;}else{ax=a.x;bx=b.x+NW;}
    const dx=Math.max(40,Math.abs(bx-ax)/2)*(acx<bcx?1:-1);
    return path(`M${ax} ${ay} C${ax+dx} ${ay},${bx-dx} ${by},${bx} ${by}`,l,rel);
  }).join('');
}
function path(d,l,rel){
  let c='lk'; if(dbOf(l.from)!=='Oracle')c+=' logical';
  if(bigFade&&(l.from.big||l.to.big))c+=' faded';
  if(l.from.planned||l.to.planned)c+=' planned';
  if(rel){ c+=(l.from.id===rel||l.to.id===rel)?' on':' dim'; }
  return `<path class="${c}" d="${d}" marker-start="url(#mMany)" marker-end="url(#mOne)"/>`;
}

(()=>{ const el=$('#chips'); let st=null, justDragged=false;
  el.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse'||e.button>0)return; e.preventDefault(); st={id:e.pointerId,x:e.clientX,sl:el.scrollLeft,moved:false}; });
  el.addEventListener('pointermove',e=>{ if(!st||e.pointerId!==st.id)return; const dx=e.clientX-st.x;
    if(!st.moved){ if(Math.abs(dx)<5)return; st.moved=true; el.setPointerCapture(e.pointerId); el.classList.add('grabbing'); }
    el.scrollLeft=st.sl-dx; });
  const end=e=>{ if(!st||e.pointerId!==st.id)return; if(st.moved){ justDragged=true; setTimeout(()=>justDragged=false,0); } el.classList.remove('grabbing'); st=null; };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end); el.addEventListener('lostpointercapture',end);
  el.addEventListener('click',e=>{ if(justDragged){ e.stopPropagation(); e.preventDefault(); justDragged=false; } },true);
  el.addEventListener('dragstart',e=>e.preventDefault());
  el.addEventListener('wheel',e=>{ if(el.scrollWidth<=el.clientWidth||Math.abs(e.deltaX)>Math.abs(e.deltaY))return; e.preventDefault(); el.scrollLeft+=e.deltaY; },{passive:false});
})();

const stage=$('#stage'); const pointers=new Map(); let drag=null, pinch=null;
function stagePt(e){const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function zoomAt(k,cx,cy){ k=Math.min(2.5,Math.max(.15,k)); const wx=(cx-view.x)/view.k, wy=(cy-view.y)/view.k; view.k=k; view.x=cx-wx*k; view.y=cy-wy*k; applyView(); }
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.zoombox')||e.button>0)return;
  if(!e.target.closest('input,textarea,select,[contenteditable]')){ e.preventDefault(); const ae=document.activeElement; if(ae&&ae!==document.body&&!stage.contains(ae))ae.blur(); }
  window.getSelection&&window.getSelection().removeAllRanges(); document.body.classList.add('dragging');
  stage.setPointerCapture(e.pointerId); pointers.set(e.pointerId,stagePt(e));
  if(pointers.size===2){ const [p1,p2]=[...pointers.values()]; pinch={d:Math.hypot(p1.x-p2.x,p1.y-p2.y),k:view.k}; drag=null; return; }
  const node=e.target.closest('.node'); const p=stagePt(e);
  if(node){ const t=byId(node.dataset.id); const row=e.target.closest('.row');
    drag={type:'node',t,el:node,sx:p.x,sy:p.y,ox:t.x,oy:t.y,moved:false,ci:row?+row.dataset.ci:null}; }
  else { drag={type:'pan',sx:p.x,sy:p.y,ox:view.x,oy:view.y,moved:false}; }
});
stage.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return; const p=stagePt(e); pointers.set(e.pointerId,p);
  if(pinch&&pointers.size===2){ const [p1,p2]=[...pointers.values()]; const d=Math.hypot(p1.x-p2.x,p1.y-p2.y); zoomAt(pinch.k*d/pinch.d,(p1.x+p2.x)/2,(p1.y+p2.y)/2); return; }
  if(!drag)return; const dx=p.x-drag.sx, dy=p.y-drag.sy;
  if(!drag.moved&&Math.hypot(dx,dy)<4)return;
  if(!drag.moved){ drag.moved=true; if(drag.type==='node')snap(); else stage.classList.add('panning'); }
  if(drag.type==='node'){ drag.t.x=Math.round(drag.ox+dx/view.k); drag.t.y=Math.round(drag.oy+dy/view.k); drag.el.style.left=drag.t.x+'px'; drag.el.style.top=drag.t.y+'px'; drawLinks(); }
  else { view.x=drag.ox+dx; view.y=drag.oy+dy; applyView(); }
});
function endPtr(e){
  pointers.delete(e.pointerId); stage.classList.remove('panning'); if(!pointers.size)document.body.classList.remove('dragging');
  if(pinch){ if(pointers.size<2)pinch=null; save(); drag=null; return; }
  if(!drag)return;
  if(!drag.moved){ if(drag.type==='node')select(drag.t.id,drag.ci); else if(sel)select(null); }
  save(); drag=null;
}
stage.addEventListener('pointerup',endPtr); stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('selectstart',e=>{ if(!e.target.closest||!e.target.closest('input,textarea,[contenteditable]'))e.preventDefault(); });
stage.addEventListener('dragstart',e=>e.preventDefault());
stage.addEventListener('lostpointercapture',endPtr);
stage.addEventListener('wheel',e=>{ e.preventDefault(); const p=stagePt(e);
  if(e.shiftKey){ view.x-=(e.deltaY||e.deltaX); applyView(); }
  else zoomAt(view.k*Math.exp(-e.deltaY*.0022),p.x,p.y);
  clearTimeout(stage._s); stage._s=setTimeout(save,300);
},{passive:false});
$('#zIn').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(view.k*1.2,r.width/2,r.height/2);save();};
$('#zOut').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(view.k/1.2,r.width/2,r.height/2);save();};
$('#zPct').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(1,r.width/2,r.height/2);save();};
$('#zFit').onclick=()=>{fit();save();};
function fit(list){ list=(list||tables).filter(visible); if(!list.length)return; const r=stage.getBoundingClientRect();
  const x0=Math.min(...list.map(t=>t.x)), y0=Math.min(...list.map(t=>t.y)), x1=Math.max(...list.map(t=>t.x+NW)), y1=Math.max(...list.map(t=>t.y+nodeH(t)));
  const pad=48, k=Math.min(1.2,Math.max(.15,Math.min((r.width-pad*2)/(x1-x0),(r.height-pad*2)/(y1-y0))));
  view.k=k; view.x=(r.width-(x1-x0)*k)/2-x0*k; view.y=(r.height-(y1-y0)*k)/2-y0*k; applyView(); }
function centerOn(t){ const r=stage.getBoundingClientRect(); const k=Math.max(view.k,.8); view.k=k; view.x=r.width/2-(t.x+NW/2)*k; view.y=Math.min(40,r.height/2-(t.y+nodeH(t)/2)*k); if(nodeH(t)*k<r.height-80)view.y=r.height/2-(t.y+nodeH(t)/2)*k; applyView(); save(); }

const tableIds=()=>new Set(tables.map(t=>t.id));
function linkify(text){ const ids=tableIds(); return esc(text).replace(/[a-z][a-z0-9_]*[a-z0-9]/g,w=>ids.has(w)?`<button class="tref" data-go="${w}">${w}</button>`:w); }
function openDocs(t){ if(t)dtab=t; $('#docs').hidden=false; renderDocs(); }
function renderDocs(){
  const tabs=[['decisions','팀 결정 사항'],...Object.entries(DOCS).map(([k,d])=>[k,d.title])];
  $('#dtabs').innerHTML=tabs.map(([k,n])=>`<button class="mtab dtab${k===dtab?' on':''}" data-dtab="${k}">${n}</button>`).join('')+'<button class="btn sm x" data-dact="close">닫기</button>';
  if(dtab==='decisions'){
    $('#dbody').innerHTML=`<p class="p muted">팀이 확정하기 전까지 쓰는 예시값입니다. 값을 고치고 상태를 "확정"으로 바꾸세요. 실제 설정값은 연결된 테이블(app_policy 등)의 예시 행도 함께 고쳐야 합니다.</p>
      <div class="samples"><table class="dt"><thead><tr><th>항목</th><th>값</th><th>반영 위치</th><th>근거</th><th>상태</th><th></th></tr></thead><tbody>
      ${decisions.map((d,i)=>`<tr>${['item','value','where','reason'].map(f=>`<td><input id="d${i}-${f}" data-di="${i}" data-df="${f}" value="${esc(d[f])}"></td>`).join('')}
        <td><select id="d${i}-status" data-di="${i}" data-df="status">${['예시','검토 중','확정'].map(s=>`<option${s===d.status?' selected':''}>${s}</option>`).join('')}</select></td>
        <td><button class="btn sm danger" data-dact="del" data-di="${i}">삭제</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="mfoot" style="margin-top:10px"><button class="btn sm" data-dact="add">＋ 결정 사항 추가</button></div>`;
    return;
  }
  const d=DOCS[dtab];
  $('#dbody').innerHTML=`<div class="samples"><table class="dt"><thead><tr>${d.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr>${r.map(c=>`<td>${linkify(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
$('#bDocs').onclick=()=>openDocs();
$('#docs').addEventListener('click',e=>{
  if(e.target.id==='docs'){ $('#docs').hidden=true; return; }
  const tb=e.target.closest('[data-dtab]'); if(tb){ dtab=tb.dataset.dtab; renderDocs(); return; }
  const b=e.target.closest('[data-dact]'); if(!b)return;
  if(b.dataset.dact==='close') $('#docs').hidden=true;
  if(b.dataset.dact==='add'){ decisions.push({item:'',value:'',where:'',reason:'',status:'예시'}); save(); renderDocs(); }
  if(b.dataset.dact==='del'){ decisions.splice(+b.dataset.di,1); save(); renderDocs(); renderPanel(); }
});
$('#docs').addEventListener('input',e=>{ const el=e.target; if(el.dataset.df==null)return; decisions[+el.dataset.di][el.dataset.df]=el.value; save(); if(!sel)renderPanel(); });

/* ---------- 내보내기·불러오기 ---------- */
let tab='json';
function exportJSON(){ return JSON.stringify({project:'제자리',version:1,seedVersion:SEED_VERSION,exported_at:new Date().toISOString(),decisions,tables},null,2); }
function sqlStr(s){return "'"+String(s||'').replace(/'/g,"''")+"'";}
function ddlType(t){ t=(t||'VARCHAR2(100)').trim(); if(/^CLOB/i.test(t))return 'CLOB'; return t.replace(/\s*\(JSON\)/i,''); }
const ORA_RESERVED=new Set('ACCESS ADD ALL ALTER AND ANY AS ASC AUDIT BETWEEN BY CHAR CHECK CLUSTER COLUMN COMMENT COMPRESS CONNECT CREATE CURRENT DATE DECIMAL DEFAULT DELETE DESC DISTINCT DROP ELSE EXCLUSIVE EXISTS FILE FLOAT FOR FROM GRANT GROUP HAVING IDENTIFIED IMMEDIATE IN INCREMENT INDEX INITIAL INSERT INTEGER INTERSECT INTO IS LEVEL LIKE LOCK LONG MAXEXTENTS MINUS MLSLABEL MODE MODIFY NOAUDIT NOCOMPRESS NOT NOWAIT NULL NUMBER OF OFFLINE ON ONLINE OPTION OR ORDER PCTFREE PRIOR PUBLIC RAW RENAME RESOURCE REVOKE ROW ROWID ROWNUM ROWS SELECT SESSION SET SHARE SIZE SMALLINT START SUCCESSFUL SYNONYM SYSDATE TABLE THEN TO TRIGGER UID UNION UNIQUE UPDATE USER VALIDATE VALUES VARCHAR VARCHAR2 VIEW WHENEVER WHERE WITH'.split(' '));
function hash36(s){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0; } return h.toString(36).padStart(6,'0').slice(0,6); }
function cname(p,t,c){ const n=c?`${p}_${t}_${c}`:`${p}_${t}`; return n.length<=30?n:`${p}_${t.slice(0,30-p.length-8)}_${hash36(n)}`; }
function enumOf(c){ const d=(c.desc||'').trim();
  if(/^[A-Z][A-Z0-9_]*( \/ [A-Z][A-Z0-9_]*)+$/.test(d)) return d.split(' / ');
  if(/^CHAR\(1\)$/i.test(c.type||'')&&/Y\/N|여부/.test(d)) return ['Y','N'];
  return null; }
function notesChecks(t){ const out=[], n=t.notes||''; let i=0;
  while((i=n.indexOf('CHECK(',i))>=0){ let d=0,j=i+5; for(;j<n.length;j++){ if(n[j]==='(')d++; else if(n[j]===')'){ d--; if(!d)break; } } out.push(n.slice(i+6,j)); i=j; } return out; }
function compositeFks(t){ const out=[]; (t.notes||'').replace(/FK\(([^)]+)\)\s*→\s*(\w+)\(([^)]+)\)/g,(m,a,ref,b)=>{ out.push({cols:a.split(',').map(x=>x.trim()),ref,refCols:b.split(',').map(x=>x.trim())}); }); return out; }
function notesSequences(t){ return ((t.notes||'').match(/CREATE SEQUENCE [^;·]+/g)||[]).map(x=>x.trim()); }
function notesIndexes(t){ return ((t.notes||'').match(/CREATE (?:UNIQUE )?INDEX [^;·]+/g)||[]).map(x=>x.trim()); }
function indexLeads(t){ return notesIndexes(t).map(x=>{ const m=x.match(/ON \w+ \(([^)]+)\)/); const c=m&&m[1].split(',')[0].trim(); return /^[a-z_][a-z0-9_]*$/.test(c||'')?c:null; }).filter(Boolean); }
function uniqueGroups(t){ const g=[]; (t.notes||'').replace(/UNIQUE\(([^)]+)\)/g,(m,x)=>{g.push(x.split(',').map(s=>s.trim()));}); return g; }
function sqlVal(v){ if(v==null)return 'NULL'; if(typeof v==='number')return String(v);
  const s=String(v); if(/^\d{4}-\d{2}-\d{2}$/.test(s))return `DATE '${s}'`; if(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(s))return `TIMESTAMP '${s}:00'`; return sqlStr(s); }
function exportDDL(){
  const ora=tables.filter(t=>dbOf(t)==='Oracle'&&!t.planned), skipped=tables.filter(t=>dbOf(t)==='Oracle'&&t.planned); const L=[], warn=[];
  L.push('-- 제자리 Oracle DDL (ERD 편집기에서 생성, 스키마 v'+SEED_VERSION+')','-- 공통 컬럼 created_at, updated_at 자동 포함 (수정 없는 테이블은 updated_at 생략) · 제약 이름은 30자 이내로 축약','-- 상태 코드 CHECK 제약은 컬럼 설명이 "A / B / C" 형식일 때 자동 생성');
  if(skipped.length)L.push('-- 확장 예정이라 제외: '+skipped.map(t=>t.id).join(', '));
  L.push('');
  const seqs=ora.flatMap(notesSequences); if(seqs.length){ L.push('-- 시퀀스'); seqs.forEach(x=>L.push(x+';')); L.push(''); }
  ora.forEach(t=>{
    const cols=t.cols.map(c=>({...c})); (t.noUpdatedAt?['created_at']:['created_at','updated_at']).forEach(n=>{ if(!cols.some(c=>c.name===n))cols.push({name:n,type:'TIMESTAMP',keys:'',desc:n==='created_at'?'생성 시각':'수정 시각'}); });
    cols.forEach(c=>{ if(ORA_RESERVED.has(c.name.toUpperCase()))warn.push(`${t.id}.${c.name}`); if(c.name.length>30)warn.push(`${t.id}.${c.name} (30자 초과)`); });
    const lines=cols.map(c=>`  ${c.name.padEnd(26)} ${ddlType(c.type)}${c.name==='created_at'||c.name==='updated_at'?' DEFAULT SYSTIMESTAMP':''}${hasK(c,'PK')||hasK(c,'NN')||c.name==='created_at'||c.name==='updated_at'?' NOT NULL':''}`);  // Oracle: DEFAULT가 제약보다 앞
    const pk=cols.filter(c=>hasK(c,'PK')).map(c=>c.name); if(pk.length)lines.push(`  CONSTRAINT ${cname('pk',t.id,'')} PRIMARY KEY (${pk.join(', ')})`);
    cols.filter(c=>hasK(c,'UQ')).forEach(c=>lines.push(`  CONSTRAINT ${cname('uq',t.id,c.name)} UNIQUE (${c.name})`));
    uniqueGroups(t).forEach(g=>lines.push(`  CONSTRAINT ${cname('uq',t.id,g.join('_'))} UNIQUE (${g.join(', ')})`));
    notesChecks(t).forEach((x,i)=>lines.push(`  CONSTRAINT ${cname('ck',t.id,'r'+(i+1))} CHECK (${x})`));
    cols.forEach(c=>{ const e=enumOf(c); if(e)lines.push(`  CONSTRAINT ${cname('ck',t.id,c.name)} CHECK (${c.name} IN (${e.map(x=>`'${x}'`).join(', ')}))`); });
    L.push(`CREATE TABLE ${t.id} (`, lines.join(',\n'), ');');
    L.push(`COMMENT ON TABLE ${t.id} IS ${sqlStr((t.ko?t.ko+' - ':'')+(t.desc||''))};`);
    cols.forEach(c=>{ const s=[c.desc,c.reason].filter(Boolean).join(' / '); if(s)L.push(`COMMENT ON COLUMN ${t.id}.${c.name} IS ${sqlStr(s)};`); });
    notesIndexes(t).forEach(x=>L.push(x+';'));
    L.push('');
  });
  L.push('-- 외래키와 외래키 인덱스 (Oracle은 FK에 인덱스를 자동으로 만들지 않음. 참조 전용 테이블을 가리키는 FK는 인덱스 생략)');
  ora.forEach(t=>{ const lead=new Set([t.cols.find(c=>hasK(c,'PK'))?.name, ...t.cols.filter(c=>hasK(c,'UQ')).map(c=>c.name), ...uniqueGroups(t).map(g=>g[0]), ...indexLeads(t)]);
    const comp=compositeFks(t);
    comp.forEach(f=>{ const tg=byId(f.ref); if(!tg||dbOf(tg)!=='Oracle'||tg.planned)return;
      L.push(`ALTER TABLE ${t.id} ADD CONSTRAINT ${cname('fk',t.id,f.cols.join('_'))} FOREIGN KEY (${f.cols.join(', ')}) REFERENCES ${tg.id} (${f.refCols.join(', ')});`);
      L.push(`CREATE INDEX ${cname('ix',t.id,f.cols.join('_'))} ON ${t.id} (${f.cols.join(', ')});`); });
    t.cols.forEach(c=>{ const tg=byId(c.fk); if(!c.fk||!tg||dbOf(tg)!=='Oracle'||tg.planned)return;
      if(comp.some(f=>f.ref===c.fk&&f.cols.includes(c.name)))return; // 복합 FK가 대신함
      const tc=tg.cols[targetRowIndex(tg,c)]; if(!tc)return;
      L.push(`ALTER TABLE ${t.id} ADD CONSTRAINT ${cname('fk',t.id,c.name)} FOREIGN KEY (${c.name}) REFERENCES ${tg.id} (${tc.name});`);
      if(!lead.has(c.name)&&!tg.refOnly)L.push(`CREATE INDEX ${cname('ix',t.id,c.name)} ON ${t.id} (${c.name});`); }); });
  const st=ora.filter(t=>(t.samples||[]).length);
  if(st.length){ const dep=t=>t.cols.filter(c=>c.fk&&st.some(x=>x.id===c.fk&&x.id!==t.id)).length; st.sort((a,b)=>dep(a)-dep(b));
    L.push('','-- 예시 데이터 (팀 확정 전 예시값)');
    st.forEach(t=>t.samples.forEach(r=>{ const ks=Object.keys(r).filter(k=>t.cols.some(c=>c.name===k)); L.push(`INSERT INTO ${t.id} (${ks.join(', ')}) VALUES (${ks.map(k=>sqlVal(r[k])).join(', ')});`); }));
    L.push('COMMIT;'); }
  if(warn.length)L.unshift('-- 경고: Oracle 예약어 또는 길이 초과 컬럼 → '+warn.join(', '));
  return L.join('\n');
}
function mdEsc(s){ return String(s??'').replace(/\|/g,'\\|').replace(/\n/g,' '); }
function mdTable(head,rows){ return ['| '+head.join(' | ')+' |','|'+head.map(()=>'---').join('|')+'|',...rows.map(r=>'| '+r.map(mdEsc).join(' | ')+' |')].join('\n'); }
function exportMD(){
  const L=['# 제자리 데이터 명세 (ERD 편집기 생성, 스키마 v'+SEED_VERSION+')','',`테이블 ${tables.length}개 (확장 예정 ${tables.filter(t=>t.planned).length}) · 빅데이터 ${tables.filter(t=>t.big).length}개 · 관계 ${links().length}개`,''];
  L.push('## 팀 결정 사항','',mdTable(['항목','값','반영 위치','근거','상태'],decisions.map(d=>[d.item,d.value,d.where,d.reason,d.status])),'');
  Object.entries(GROUPS).forEach(([k,g])=>{ const ts=tables.filter(t=>t.g===k); if(!ts.length)return;
    L.push(`## ${g.name}`,'');
    ts.forEach(t=>{ L.push(`### \`${t.id}\` ${t.ko||''} (${dbOf(t)}${t.big?', 빅데이터':''}${t.planned?', 확장 예정':''}${t.noUpdatedAt?', updated_at 생략':''}${t.refOnly?', 참조 전용':''})`,''); if(t.desc)L.push(t.desc,'');
      L.push(mdTable(['컬럼','타입','키','출처','설명','이유'],t.cols.map(c=>[c.name,c.type,c.keys.replace(/,/g,', ')+(c.fk?` → ${c.fk}`:''),c.src,c.desc,c.reason])),'');
      if(t.notes)L.push(`> ${t.notes}`,'');
      if((t.samples||[]).length){ const ks=[...new Set(t.samples.flatMap(r=>Object.keys(r)))]; L.push('예시 데이터:','',mdTable(ks,t.samples.map(r=>ks.map(x=>r[x]==null?'null':r[x]))),''); }
    }); });
  Object.values(DOCS).forEach(d=>{ L.push(`## ${d.title}`,'',mdTable(d.head,d.rows),''); });
  return L.join('\n');
}
function openModal(){ $('#modal').hidden=false; setTab(tab); }
function closeModal(){ $('#modal').hidden=true; }
function setTab(v){ tab=v; document.querySelectorAll('.mtab').forEach(b=>b.classList.toggle('on',b.dataset.tab===v));
  const ta=$('#mText'); const imp=v==='import';
  ta.readOnly=!imp; ta.value=v==='json'?exportJSON():v==='ddl'?exportDDL():v==='md'?exportMD():'';
  ta.placeholder=imp?'내보낸 JSON을 붙여넣거나 파일을 선택하세요':'';
  $('#mNote').textContent={json:'팀원에게 공유하면 불러오기로 같은 구조도를 열 수 있습니다.',ddl:'Oracle 테이블만 생성합니다. MongoDB·Redis와 확장 예정 테이블은 제외. 예시 데이터 INSERT 포함.',md:'결정 사항·전체 테이블·예시 데이터·설계 문서를 한 파일 Markdown 명세로 만듭니다.',import:'불러오면 현재 구조도를 덮어씁니다. Ctrl+Z로 되돌릴 수 있습니다.'}[v];
  $('#mAct').textContent=imp?'불러오기':'복사'; $('#mFileBtn').hidden=!imp; $('#mReset').hidden=!imp;
  $('#mReset').classList.remove('armed'); $('#mReset').textContent='기본 스키마로 초기화';
}
$('#bIO').onclick=openModal; $('#mClose').onclick=closeModal;
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal')closeModal(); const t=e.target.closest('.mtab'); if(t)setTab(t.dataset.tab); });
$('#mAct').onclick=async()=>{
  const ta=$('#mText');
  if(tab!=='import'){ try{await navigator.clipboard.writeText(ta.value);toast('복사했습니다');}catch(err){ta.focus();ta.select();toast('선택됨 · Ctrl+C로 복사하세요');} return; }
  try{ const d=JSON.parse(ta.value); const list=Array.isArray(d)?d:d.tables;
    if(!Array.isArray(list)||!list.every(t=>t&&t.id&&Array.isArray(t.cols)))throw new Error('tables 배열이 없습니다');
    snap(); tables=list.map(t=>({id:String(t.id),ko:t.ko||'',g:GROUPS[t.g]?t.g:'ref',db:t.db||'',big:!!t.big,planned:!!t.planned,noUpdatedAt:!!t.noUpdatedAt,refOnly:!!t.refOnly,samples:Array.isArray(t.samples)?t.samples:[],desc:t.desc||'',notes:t.notes||'',x:+t.x||0,y:+t.y||0,
      cols:t.cols.map(c=>({name:String(c.name||''),type:c.type||'',keys:c.keys||'',src:c.src||'',desc:c.desc||'',reason:c.reason||'',fk:c.fk||''}))}));
    if(Array.isArray(d.decisions))decisions=d.decisions;
    if(tables.every(t=>!t.x&&!t.y))autoLayout(); sel=null; renderAll(); fit(); save(); closeModal(); toast(`테이블 ${tables.length}개를 불러왔습니다`);
  }catch(err){ toast('JSON 형식이 올바르지 않습니다: '+err.message); }
};
$('#mFileBtn').onclick=()=>$('#mFile').click();
$('#mFile').onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{$('#mText').value=r.result;}; r.readAsText(f); e.target.value=''; };
$('#mReset').onclick=e=>{ const b=e.currentTarget; if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='한 번 더 누르면 초기화';return;}
  snap(); tables=fromSeed(); decisions=JSON.parse(JSON.stringify(DECISIONS_SEED)); autoLayout(); hidden.clear(); sel=null; renderAll(); fit(); save(); closeModal(); toast('기본 스키마로 초기화했습니다'); };

/* ---------- 시작 ---------- */
const stored=load();
if(!stored){ tables=fromSeed(); decisions=JSON.parse(JSON.stringify(DECISIONS_SEED)); autoLayout(); renderAll(); requestAnimationFrame(()=>{fit();save();}); }
else { const r=migrate(stored.seedVersion); renderAll(); if(r){ save(); if(r.added)requestAnimationFrame(()=>fit()); setTimeout(()=>toast(`스키마 v${SEED_VERSION} 반영: 새 테이블 ${r.added}개 추가, 컬럼·키 수정 적용`),500);} }
syncBig(); syncPlan();
</script>
