// 식별정보 가명처리(HMAC) 모듈. Spring에 의존하지 않는 순수 Java 라이브러리라
// 대기열(A)·회원(D)·로그(D)·인증(E) 어디서든 가져다 쓸 수 있다.
plugins {
    id 'java-library'
}

group = 'com.jejari'
version = '0.1.0'
sourceCompatibility = '21'
targetCompatibility = '21'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 소스에 한글이 있으므로 인코딩을 명시한다. 지정하지 않으면 Windows(JDK 17 이하)는 MS949로 읽어
// 한글이 깨지거나 컴파일이 실패한다 (JDK 18 이상은 기본이 UTF-8).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    defaultCharacterEncoding = 'UTF-8'
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}
