// 개인정보 암호화(AES-256-GCM)·화면 마스킹 모듈. Spring에 의존하지 않는 순수 Java 라이브러리라
// 회원(D)·알림·관리자 화면 어디서든 가져다 쓸 수 있다. 해시(HMAC)는 A의 hmac 모듈(Pseudonymizer)을 쓴다.
plugins {
    id 'java-library'
}

group = 'com.jejari'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

// Windows 기본 인코딩(MS949)에서도 한글 소스·테스트 이름이 깨지지 않게
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}
