# k6 결과 + Spring Boot 지표를 Grafana 한 화면에서 보기 위한 구성
#   docker compose -f monitoring/docker-compose.monitor.yml up -d
#   Grafana: http://localhost:3000 (admin / admin)   Prometheus: http://localhost:9090
services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver # k6 → Prometheus remote write 수신
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on:
      - prometheus
