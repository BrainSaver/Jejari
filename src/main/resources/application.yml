# 공용 설정. 비밀값은 환경 변수나 저장소 루트의 .env(커밋 금지, 키 목록은 .env.example)로 넣습니다.
# 개인 설정은 application-local.yml(커밋 금지)에 두고 --spring.profiles.active=local로 켭니다.
spring:
  application:
    name: jejari
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    # 기본 인메모리 사용자(기동 로그에 비밀번호 출력)를 만들지 않습니다. 인증은 JWT로 직접 구성합니다
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # 종료 단계마다 기다리는 최대 시간 (기본 30초 → 10초). Kafka가 멈춘 채 종료하면 Kafka 소비자 단계가 30초를 다 써서
  # 종료가 47초 걸렸다 (2026-11-20 실측) → 서버의 강제 종료(TimeoutStopSec 40초)에 걸려 행동 로그를 디스크에 적기 전에 죽는다.
  # 요청은 길어야 몇 초(Redis·Mongo 2초, DB 연결 5초 제한)라 10초면 마무리된다. 계산은 BehaviorPublisher.destroy 주석
  lifecycle:
    timeout-per-shutdown-phase: 10s

  # ── 정기 작업(@Scheduled) 스레드 ──
  # 기본값은 1개라 모든 정기 작업이 한 스레드를 나눠 씁니다. 대기열 입장 처리(1초 주기)가 1초를 넘기자
  # 좌석 선점 만료·Outbox 발행·결제 재확인이 그만큼 늦게 시작될 수 있었습니다 (공용 서버 2026-11-18 실측).
  # 같은 작업이 겹쳐 돌지는 않고(Spring이 보장), 서로 다른 작업이 동시에 도는 것은 앱 2대에서 이미 일어나는 일이라 새 위험이 아닙니다.
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: jejari-sched-

  # ── Oracle (gvenzl/oracle-free, 서비스 FREEPDB1) ──
  datasource:
    url: jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:FREEPDB1}
    username: ${ORACLE_APP_USER:jejari}
    password: ${ORACLE_APP_PASSWORD}
    hikari:
      # DB 세션 시간대 고정 (concurrency.md §0.7). 기동 시 TimeZoneVerifier가 확인합니다 (T34)
      connection-init-sql: ALTER SESSION SET TIME_ZONE = 'Asia/Seoul'
      # 커넥션 풀 (기본 10 → 20). 300명이 10초 안에 예매하면 10개가 다 차서 요청이 줄을 섰다.
      # 같은 조건(데운 앱)에서 10 → 20: 선점 p95 1.73 → 1.26초, 최대 2.94 → 1.70초, 커넥션 대기 9 → 0. 30에서도 실제 사용은 최대 18개.
      # Oracle Free는 CPU 2개라 더 키워도 DB 안에서 줄만 선다. 앱 2대여도 40 < Oracle processes 200.
      # 근거·재현: docs/강동균/features/용량-시험-안내.md "예매 쪽 데이터 처리"
      maximum-pool-size: 20
      # 풀이 다 찼을 때 기다리는 최대 시간 (기본 30초 → 5초). 오래 기다리면 그동안 요청 스레드를 쥐고 있어
      # 다른 API까지 막힌다 (로그인 폭주 때와 같은 원리). 넘으면 빨리 실패하는 편이 낫다
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 docs/erd/jejari-erd.ddl.sql이 원본. JPA가 테이블을 만들거나 바꾸지 않습니다
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  # ── MongoDB (Boot 4부터 spring.mongodb.*) ──
  mongodb:
    # 붙지 못하면 오래 붙잡지 않고 실패시킵니다 (드라이버 기본값은 30초라 요청이 그만큼 멈춥니다). Redis timeout 2s와 같은 이유
    uri: mongodb://${MONGO_APP_USER:jejari}:${MONGO_APP_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/jejari?authSource=jejari&serverSelectionTimeoutMS=2000&connectTimeoutMS=2000

  # ── Redis (단일 노드, noeviction, AOF everysec: concurrency.md §14.5) ──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 끊기거나 느리면 오래 붙잡지 않고 실패시킵니다 (기본값은 60초라 스레드가 묶여 앱 전체가 멈춥니다). 실패는 503
      timeout: 2s
      connect-timeout: 2s

  # ── Kafka ──
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      # 멱등 프로듀서 (CLAUDE.md "Kafka")
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest

  jackson:
    time-zone: Asia/Seoul

jejari:
  # 개발 모드: 로그인 없이 X-Member-Id 헤더로 회원을 구분하고, 회원·운행 연동이 없어도 대기열을 켜는 대용품과
  # 부하 테스트용 관리 API(/api/v1/dev/**)를 엽니다. 운영에서는 반드시 false.
  dev-mode: false
  # 식별정보 가명처리(HMAC) 키. 프로젝트 기간 동안 바꾸지 않습니다 (common/hmac)
  hmac:
    key: ${JEJARI_HMAC_KEY:}
  # 예매 안내 챗봇 (chat, Groq). 키가 비어 있으면 챗봇이 꺼진다. 키는 환경변수로만 (.env, 커밋 금지)
  chat:
    groq-api-key: ${GROQ_API_KEY:}
    model: ${GROQ_CHAT_MODEL:openai/gpt-oss-120b}
  # 개인정보 암호화(AES-256-GCM) 키 목록과 현재 키 (common/pii). 비어 있으면 앱이 뜨지 않습니다
  pii:
    keys: ${JEJARI_ENC_KEYS:}
    active-key: ${JEJARI_ENC_ACTIVE:}
  # 회원 인증 (member). 비밀번호 pepper는 비어 있으면 앱이 뜨지 않습니다
  auth:
    pepper-keys: ${JEJARI_PEPPER_KEYS:}
    pepper-active: ${JEJARI_PEPPER_ACTIVE:}
    # 프록시(로드밸런서) 뒤에서만 X-Forwarded-For를 믿습니다. 비어 있으면 연결한 주소만 씁니다 (위조 방지)
    trusted-proxies: ""
  queue:
    scheduler-enabled: true   # 입장 스케줄러(1초마다 입장 처리). 앱 1대 기준입니다
    policy-cache-ms: 1000     # 정책(app_policy) 값을 앱에서 들고 있는 시간. 바꾸면 최대 이만큼 뒤에 반영
    risk-sync-stale-after: 30m  # 위험 점수 표시 키(risk:meta:synced_at)가 이보다 오래되면 경고 (재동기화 주기 10분의 3배). 점수는 그대로 사용
    dev-on-sale-runs: ""      # 개발 모드에서 판매 중으로 볼 운행 ID (예: 9001, 시드(db/seed)의 ON_SALE 운행은 9001·9002)
  seat:
    # 단체 할당석 만들기 (concurrency.md §18.1, GroupQuotaScheduler). 판매 오픈 때 좌석의 group.quota_rate(5%)를 BLOCKED로 묶고
    # 단체 승인(GroupAllocator)이 거기서 배정한다. 남은 할당석은 출발 group.quota_release_days(30)일 전에 개인 판매로 풀린다(§18.4, 늘 돈다).
    # 단체 API가 들어와 기본으로 켰다 (2026-11-27). 봇 대회처럼 좌석 수를 고정해야 하면 JEJARI_GROUP_QUOTA_ENABLED=false
    group-quota:
      create-enabled: ${JEJARI_GROUP_QUOTA_ENABLED:true}
  train:
    # 시드 편성(horizon-trains)의 운행을 오늘 ~ 2개월+1일까지 매일 이어 준다 (RunHorizonScheduler, 10분마다).
    # 대기열 입장 스케줄러가 활성 운행(queue:runs)만 돌게 고쳐져(5fc4504) 운행이 늘어도 1초 틱이 밀리지 않아 기본으로 켰다 (2026-11-27)
    run-horizon-enabled: ${JEJARI_RUN_HORIZON_ENABLED:true}
  risk:
    # 위험 점수 캐시(risk:*) 재동기화: Oracle risk_score → Redis. 앱 시작 직후 한 번, 그 뒤 이 간격마다 (RiskCacheResync)
    cache-resync-enabled: true
    cache-resync-interval: 10m
    # 위험 점수 배치 (RISK-02, RiskScoreBatch): 새 신호가 생긴 대상(risk:dirty)만 이 간격마다 다시 계산
    batch-enabled: true
    batch-interval: 1m
    batch-max-run: 40s          # 한 번 실행 한도. 남은 대상은 다음 주기에
    behavior-window: 1d         # 행동 로그 집계 기간 (지난 증거는 이전 점수의 반감기로 남음)
    purchase-window: 30d        # 구매·취소 집계 기간
    decay-refresh-after: 1d     # 새 신호가 없어도 이만큼 지난 점수는 감쇠를 반영해 다시 계산
    signal-listener-enabled: true  # 예약 확정·취소 이벤트 소비 (risk-signal)
  # 공용 서버 수동 배포 버튼 (관리자 화면 A-08, DeployAdminService). 서버 .env에서만 켭니다.
  # 버튼은 서버의 자동 배포 장치(jejari-autodeploy)를 지금 한 번 실행시킬 뿐이라 CI·ERD 확인은 그대로입니다
  ops:
    deploy:
      enabled: ${JEJARI_OPS_DEPLOY_ENABLED:false}
      admin-ids: ${JEJARI_OPS_DEPLOY_ADMIN_IDS:}   # 누를 수 있는 관리자 번호(admin_user.admin_id), 쉼표로
    # A-10 트래픽 관제가 읽는 Prometheus (서버·PC 모두 같은 호스트의 127.0.0.1:9090, TrafficService)
    prometheus-url: ${JEJARI_PROMETHEUS_URL:http://127.0.0.1:9090}
  # 첫 관리자 계정 (AUTH-05, AdminBootstrap). admin_user가 비어 있을 때만 SUPERVISOR 1명을 만듭니다
  admin:
    bootstrap:
      login-id: ${JEJARI_ADMIN_BOOTSTRAP_ID:}
      password: ${JEJARI_ADMIN_BOOTSTRAP_PASSWORD:}
  jwt:
    issuer: jejari
    access-ttl: 15m
    refresh-ttl: 14d          # 회원이 "로그인 상태 유지"를 골랐을 때. 로그인 시점부터 고정, 재발급해도 늘지 않음
    session-refresh-ttl: 12h  # 고르지 않았을 때 (쿠키는 브라우저를 닫으면 사라짐)
    admin-refresh-ttl: 8h     # 관리자 (마스킹 해제·강제 취소 권한, 쿠키는 브라우저를 닫으면 사라짐)
    clock-skew: 30s
    active-kid: ${JWT_ACTIVE_KID:k1}
    secrets:                  # kid: Base64 키(32바이트 이상). 키 교체 방법은 JwtProperties 주석
      k1: ${JWT_SECRET_K1:}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}
  event:
    # Outbox 릴레이 (EVT-02). 1차는 인스턴스 1대가 샤드 0~15를 혼자 처리하므로 여러 대를 띄우면 한 대에서만 켭니다
    relay:
      enabled: true
      interval-ms: 200        # 한 바퀴 끝나고 쉬는 시간
      send-timeout: 10s       # Kafka 확인(acks=all) 대기 한도
    cleanup-enabled: true     # 발행 끝난 outbox·오래된 processed_event 정리 (매일 04:10)
    policy-cache-ms: 10000    # app_policy 값을 앱에서 들고 있는 시간
  # 결제 PG 연결 (PaymentConfig). 기본은 앱 안의 가짜 PG(mock, 0초 응답). 결제 부하 시험 때만 http로
  # (가짜 PG 서버 loadtest/mock-pg/server.js, 결과: docs/강동균/features/PG-지연-시험.md)
  payment:
    pg:
      mode: ${JEJARI_PG_MODE:mock}              # mock | http
      base-url: ${JEJARI_PG_URL:http://127.0.0.1:8090}   # 이 기기 밖이면 https만 (카드번호가 본문에 들어감)
      connect-timeout-ms: 1000
      # 승인 응답 한도. 넘으면 결과 모름 → 마감에 스캐너가 PG에 조회. 결제 한 건이 요청 스레드를 붙잡는 최대 시간이라
      # 가장 중요한 방어다 (2026-11-27 로컬: PG 응답 장애 때 30초면 스레드 200개가 다 참, 3초면 최고 68개)
      read-timeout-ms: 3000
      # PG 동시 승인 상한 (PgBulkhead). 0이면 끔. 넘치면 503 PAYMENT_BUSY + Retry-After
      max-concurrent: ${JEJARI_PG_MAX_CONCURRENT:0}
      acquire-wait-ms: 0
      busy-retry-after-sec: 3
  # 알림 (EVT-06·WL-04). 실제 푸시·메일 없이 알림함(IN_APP) + 로그
  notification:
    consumer-enabled: true      # 예약 이벤트 → 알림 행 (소비 그룹 notification: 만료·환불)
    reminder-enabled: true      # 결제 기한 임박 PAY_REMINDER (기한 notification.pay_reminder_sec 전)
    reminder-interval-ms: 10000
    dispatcher-enabled: true    # 안 보낸 알림을 가상 채널로 발송(로그)하고 sent_at 기록
    dispatch-interval-ms: 1000

server:
  error:
    # 실패 응답은 GlobalExceptionHandler가 { code, message, traceId }로 만듭니다
    include-message: never
    include-stacktrace: never
  tomcat:
    # Tomcat 요청 스레드 사용량 메트릭(tomcat_threads_busy_threads) — 스레드가 다 찼는지 보려고 (Grafana)
    mbeanregistry:
      enabled: true
    # 동시 연결 한도. 기본(8192 + 대기 100)이면 대기열 진입 폭주 시험(VU 9,200)에서 새 연결을 거절했다
    # (connectex "actively refused": 입장 성공 71.5%, 실패 11,068건). 20000 + 2000으로 올리자 같은 시험에서 거절 0건·입장 100%.
    # 연결이 느는 만큼 메모리를 조금 더 쓸 뿐이다. 요청 스레드(기본 200)는 DB 대기가 병목이라 그대로 둔다.
    max-connections: 20000
    accept-count: 2000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    # p95·p99 응답 시간을 Prometheus에서 계산하려면 히스토그램 버킷이 필요합니다 (k6 개선 전후 비교, Grafana)
    distribution:
      percentiles-histogram:
        http.server.requests: true
        lettuce: true
        hikaricp.connections.acquire: true
      minimum-expected-value:
        http.server.requests: 1ms
        lettuce: 100us
      maximum-expected-value:
        http.server.requests: 10s
        lettuce: 1s

logging:
  pattern:
    # 모든 로그 줄에 traceId (TraceIdFilter가 MDC에 넣음)
    correlation: "[%X{traceId:-}] "
