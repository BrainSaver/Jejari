plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jejari'
version = '0.1.0'
sourceCompatibility = '21'
targetCompatibility = '21'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 소스에 한글이 있으므로 인코딩을 명시한다. 지정하지 않으면 Windows(JDK 17 이하)는 MS949로 읽어
// 한글이 깨지거나 컴파일이 실패한다 (JDK 18 이상은 기본이 UTF-8).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 시간대는 JVM·Oracle·DB 세션을 모두 Asia/Seoul로 고정한다 (concurrency.md §0.7)
tasks.withType(Test).configureEach {
    defaultCharacterEncoding = 'UTF-8'
    useJUnitPlatform()
    jvmArgs '-Duser.timezone=Asia/Seoul'
    testLogging { events 'failed'; exceptionFormat 'full' }
}
tasks.named('bootRun') {
    defaultCharacterEncoding = 'UTF-8'
    jvmArgs '-Duser.timezone=Asia/Seoul'
}
