spring:
  application:
    name: jejari-queue
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      # 응답이 늦으면 오래 붙잡지 않고 실패시킨다 (기본값은 60초)
      timeout: 2s
      connect-timeout: 2s

jejari:
  # 개발용 대용품(X-Member-Id 헤더 인증, 가짜 회원·운행)을 켠다. 운영에서는 반드시 false.
  dev-mode: false
  queue:
    scheduler-enabled: true
    # 정책(app_policy) 값을 앱 안에서 들고 있는 시간. 정책을 바꾸면 최대 이만큼 뒤에 반영된다.
    policy-cache-ms: 1000
    # 개발용 판매 중 운행 (OnSaleRunProvider 실제 구현이 붙으면 쓰지 않음)
    dev-on-sale-runs: ""
