// 규칙 기반 위험 점수 엔진 (RISK-02). Spring·DB에 의존하지 않는 순수 Java 라이브러리라
// 배치(1분 주기)·취소 이벤트 컨슈머 어디서든 같은 계산을 쓴다. 입력 집계(Oracle·MongoDB 조회)는 앱 쪽 책임.
plugins {
    id 'java-library'
}

group = 'com.jejari'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

// Windows 기본 인코딩(MS949)에서도 한글 소스·테스트 이름이 깨지지 않게
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}
