plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jejari'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// JWT 서명·검증 (Nimbus). 직접 파싱하지 않고 Spring Security 리소스 서버에 맡깁니다
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 비밀번호 Argon2id (Spring Security Argon2PasswordEncoder가 BouncyCastle 구현을 씀)
	implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc17'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 클래스 이름은 영문으로 (테스트의 @Nested 포함). 한글 이름은 .class 파일 이름이 되는데, 로케일이 UTF-8이 아닌 PC·서버
// (LANG 비어 있음 = POSIX)에서는 javac가 그 파일을 못 써서 "bad filename"으로 컴파일이 멈춘다 (2026-11-25).
// 보이는 이름이 한글이어야 하면 @DisplayName("…")을 붙인다. 메서드 이름은 파일이 되지 않아 한글이어도 괜찮다.
tasks.register('checkAsciiClassNames') {
	description = '클래스 이름에 한글 등 ASCII 밖 문자가 있으면 멈춘다 (UTF-8이 아닌 로케일에서 컴파일 실패 방지)'
	def sources = fileTree('src') { include '**/*.java' }
	inputs.files(sources)
	doLast {
		def decl = ~/^\s*(?:(?:public|private|protected|static|final|abstract|sealed)\s+)*(?:class|interface|record|enum)\s+([^\s{(<]+)/
		def bad = []
		sources.each { f ->
			f.eachLine('UTF-8') { line, n ->
				def m = line =~ decl
				if (m.find() && m.group(1).any { (it as char) > 127 }) bad << "${projectDir.toPath().relativize(f.toPath())}:${n}  ${m.group(1)}"
			}
		}
		if (bad) throw new GradleException("클래스 이름은 영문으로 쓰고, 보이는 이름은 @DisplayName(\"…\")으로 붙이세요:\n  " + bad.join('\n  '))
	}
}
tasks.named('compileJava') { dependsOn 'checkAsciiClassNames' }
tasks.named('compileTestJava') { dependsOn 'checkAsciiClassNames' }
// 테스트 HTML 보고서는 테스트 메서드마다 파일을 만들고, 메서드 이름은 한글이 많다. UTF-8이 아닌 로케일에서는 그 파일을
// 못 써서 테스트가 다 통과해도 빌드가 실패한다 → 그때만 HTML 보고서를 끄고 알린다 (XML 결과는 그대로)
def nameEncoding = System.getProperty('sun.jnu.encoding') ?: ''
if (!(nameEncoding.toUpperCase() in ['UTF-8', 'UTF8'])) {
	logger.warn("파일 이름 인코딩이 ${nameEncoding}라 테스트 HTML 보고서를 끕니다. 보고서가 필요하면 LC_ALL=C.UTF-8 로 실행하세요")
	tasks.withType(Test).configureEach { reports.html.required = false }
}

// 기본 test는 DB·Redis·Kafka 없이 돕니다 (CI). 인프라가 필요한 통합 테스트는 @Tag("infra")를 붙이고
// docker compose up -d 뒤에 ./gradlew infraTest 로 따로 돌립니다.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'infra'
	}
}

// 테스트 중에는 알림 소비자·기한 임박 스캐너를 끕니다. 켜 두면 다른 테스트의 회원에게 알림 행이 생겨
// 그 테스트가 끝날 때 회원을 지우다 FK 오류가 납니다. 알림 테스트는 처리 메서드를 직접 부릅니다.
tasks.withType(Test).configureEach {
	// 앱은 JejariApplication.main에서 Asia/Seoul로 고정하지만 테스트는 main을 거치지 않는다. PC 시간대가 UTC면(리눅스·CI·클라우드)
	// TimeZoneVerifier가 "JVM=Z"로 컨텍스트를 못 띄워 통합 테스트가 전부 실패한다 (2026-11-24)
	systemProperty 'user.timezone', 'Asia/Seoul'
	systemProperty 'jejari.notification.consumer-enabled', 'false'
	systemProperty 'jejari.notification.reminder-enabled', 'false'
	// 데이터 놓침·밀림 지표(PipelineMetrics)도 끈다: 테스트 중 15초마다 Kafka AdminClient·outbox 집계가 돌면 로그만 시끄럽다
	systemProperty 'jejari.ops.pipeline-metrics-enabled', 'false'
	// 테스트는 Spring 컨텍스트를 여러 개(20여 개) 띄워 두므로 컨텍스트마다 커넥션을 적게. 운영 풀(20, 늘 20개 유지)을 그대로 쓰면
	// 20 × 20여 개 > Oracle Free processes 200이라 통합 테스트가 연결을 못 얻는다 (ORA-17800)
	systemProperty 'spring.datasource.hikari.maximum-pool-size', '10'
	systemProperty 'spring.datasource.hikari.minimum-idle', '2'
	// 환불 재시도 배치(CNL-03)도 끈다. 켜 두면 다른 테스트가 일부러 만든 FAILED 환불을 테스트 도중에 DONE으로 바꾼다
	systemProperty 'jejari.refund.retry-enabled', 'false'
	// 재판매 집계 배치(CNL-04)도 끈다. 테스트가 운행을 잠깐 DEPARTED로 바꿀 때 다른 취소를 Y로 바꾸지 않게 (run()을 직접 부름)
	systemProperty 'jejari.resale.batch-enabled', 'false'
	// 행동 로그 디스크 버퍼를 빌드 폴더에 (사용자 홈 ~/.jejari에 테스트 로그가 남지 않게)
	systemProperty 'jejari.behavior.spill-dir', layout.buildDirectory.dir('behavior-spill').get().asFile.path
}

tasks.register('infraTest', Test) {
	description = '인프라(Redis 등)가 떠 있어야 하는 통합 테스트 (@Tag("infra"))'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'infra'
	}
	shouldRunAfter tasks.named('test')
}

// 프론트엔드 (frontend/, React + Vite). `npm run build`로 만든 dist/를 jar의 static/에 넣어 앱과 같은 출처로 내보낸다.
// dist가 없으면(프론트를 빌드하지 않은 CI 등) 그냥 건너뛴다 → 백엔드 빌드는 Node 없이도 돈다.
// 한 번에 하려면: ./gradlew buildFrontend bootJar
tasks.named('processResources') {
	from('frontend/dist') {
		into 'static'
	}
}

tasks.register('buildFrontend', Exec) {
	description = 'frontend/ 를 npm ci + vite build 로 빌드 (Node 22 필요)'
	group = 'build'
	workingDir 'frontend'
	commandLine 'sh', '-c', 'npm ci && npm run build'
}
tasks.named('processResources') { mustRunAfter 'buildFrontend' }
