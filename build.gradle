plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jejari'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// JWT 서명·검증 (Nimbus). 직접 파싱하지 않고 Spring Security 리소스 서버에 맡깁니다
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 비밀번호 Argon2id (Spring Security Argon2PasswordEncoder가 BouncyCastle 구현을 씀)
	implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc17'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 기본 test는 DB·Redis·Kafka 없이 돕니다 (CI). 인프라가 필요한 통합 테스트는 @Tag("infra")를 붙이고
// docker compose up -d 뒤에 ./gradlew infraTest 로 따로 돌립니다.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'infra'
	}
}

// 테스트 중에는 알림 소비자·기한 임박 스캐너를 끕니다. 켜 두면 다른 테스트의 회원에게 알림 행이 생겨
// 그 테스트가 끝날 때 회원을 지우다 FK 오류가 납니다. 알림 테스트는 처리 메서드를 직접 부릅니다.
tasks.withType(Test).configureEach {
	systemProperty 'jejari.notification.consumer-enabled', 'false'
	systemProperty 'jejari.notification.reminder-enabled', 'false'
}

tasks.register('infraTest', Test) {
	description = '인프라(Redis 등)가 떠 있어야 하는 통합 테스트 (@Tag("infra"))'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'infra'
	}
	shouldRunAfter tasks.named('test')
}
