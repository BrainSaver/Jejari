name: CI

on:
  push:
    branches: [main, SeongWon, DongGyun, DongHyeon, DaIn, YoungJun]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 캐시 + 래퍼 검증
      - uses: gradle/actions/setup-gradle@v4

      # 테스트는 DB·Redis·Kafka 없이 돌도록 작성합니다 (인프라가 필요한 통합 테스트는 따로 표시)
      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  erd:
    name: ERD check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 스키마 커밋은 FAIL 0이어야 합니다 (CLAUDE.md)
      - name: check-erd
        run: node tools/check-erd.js docs/erd/jejari-erd.html
