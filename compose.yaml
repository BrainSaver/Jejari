# 제자리 로컬 인프라. 앱(Spring Boot)은 IDE에서 호스트로 실행하고 여기 컨테이너에 붙습니다.
#   준비: .env.example을 .env로 복사하고 비밀번호 채우기 (.env는 커밋 금지)
#   실행: docker compose up -d      상태: docker compose ps      정리: docker compose down (-v는 데이터까지 삭제)
# 포트는 127.0.0.1에만 열어 같은 네트워크의 다른 PC에서 DB에 붙지 못하게 합니다.
name: jejari

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      TZ: Asia/Seoul                         # SYSTIMESTAMP 시간대 (concurrency.md §0.7)
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?.env에 ORACLE_PASSWORD 필요}
      APP_USER: ${ORACLE_APP_USER:-jejari}   # FREEPDB1에 앱 계정 생성
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:?.env에 ORACLE_APP_PASSWORD 필요}
    ports: ["127.0.0.1:1521:1521"]
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle/init:/container-entrypoint-initdb.d:ro   # 첫 기동 때만 실행
      - ./docs/erd/jejari-erd.ddl.sql:/schema/jejari-erd.ddl.sql:ro
      - ./db/seed:/seed:ro                                       # 기준 데이터 (DATA-01)
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mongo:
    image: mongo:8.0
    environment:
      TZ: Asia/Seoul
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?.env에 MONGO_ROOT_PASSWORD 필요}
      MONGO_INITDB_DATABASE: jejari
      MONGO_APP_USER: ${MONGO_APP_USER:-jejari}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?.env에 MONGO_APP_PASSWORD 필요}
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro   # 첫 기동 때만 실행
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    # 단일 노드, noeviction, AOF everysec (concurrency.md §14.5)
    # maxmemory를 정해야 noeviction이 "메모리 부족 = 쓰기 오류"로 드러납니다
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?.env에 REDIS_PASSWORD 필요}
    environment:
      TZ: Asia/Seoul
      REDISCLI_AUTH: ${REDIS_PASSWORD}       # healthcheck의 redis-cli가 사용
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    # KRaft 단일 노드. 컨테이너끼리는 kafka:29092, 호스트(앱·IDE)는 localhost:9092
    environment:
      TZ: Asia/Seoul
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # 토픽은 kafka-init이 만듦. 오타 토픽 방지
      KAFKA_LOG_RETENTION_HOURS: 168             # 7일. inbox.retention_days(8일)가 이 값에 묶임 (concurrency.md §12)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["127.0.0.1:9092:9092"]
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # 토픽을 만들고 종료하는 일회성 컨테이너 (기능설계서 8.1). 이미 있으면 건너뜁니다
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ./docker/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 호스트에서 실행 중인 앱 수집 (Linux에서도 동작하게)

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      TZ: Asia/Seoul
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?.env에 GRAFANA_ADMIN_PASSWORD 필요}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  oracle-data:
  mongo-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
